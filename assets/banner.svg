<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Aurora Radial Gradients -->
    <radialGradient id="glowViolet" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      @keyframes dashAnim {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      @keyframes badgePulse {
        0%, 100% { border-color: rgba(99, 102, 241, 0.4); opacity: 0.9; }
        50% { border-color: rgba(6, 182, 212, 0.8); opacity: 1; }
      }
      .floating-pill-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatReverse 6s ease-in-out infinite;
      }
      .data-stream {
        stroke-dasharray: 8 6;
        animation: dashAnim 12s linear infinite;
      }
      .pulsing-glow {
        transform-origin: center;
        animation: pulseGlow 8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Slate Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Aura / Dynamic Glows -->
  <g class="pulsing-glow">
    <circle cx="240" cy="100" r="220" fill="url(#glowViolet)" />
    <circle cx="980" cy="240" r="200" fill="url(#glowCyan)" />
    <circle cx="600" cy="320" r="180" fill="url(#glowEmerald)" />
  </g>

  <!-- Subdued Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic Animated Data Streams (Sales Operations Pipeline) -->
  <g opacity="0.35">
    <path class="data-stream" d="M 50 180 C 250 80, 450 280, 650 180 S 950 80, 1150 180" fill="none" stroke="#6366f1" stroke-width="2.5" />
    <path class="data-stream" d="M 50 240 C 300 320, 500 120, 750 220 S 1000 300, 1150 210" fill="none" stroke="#06b6d4" stroke-width="1.8" />
  </g>

  <!-- Outer Card Frame Border -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Background Decorative Dynamic Pills (low opacity, placed behind text) -->
  <g class="floating-pill-1" opacity="0.4">
    <rect x="80" y="45" width="130" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="145" y="63" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" font-weight="500">B2B OMS</text>
  </g>
  <g class="floating-pill-2" opacity="0.4">
    <rect x="990" y="45" width="140" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="1060" y="63" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" font-weight="500">DIGITAL LINESHEETS</text>
  </g>

  <!-- ================= FOREGROUND CONTENT ================= -->
  <!-- Top Category Badge Pill -->
  <g transform="translate(600, 52)">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" filter="url(#pillShadow)" />
    <circle cx="-135" cy="0" r="4" fill="#38bdf8" />
    <text x="5" y="5" fill="#c7d2fe" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      ENTERPRISE B2B COMMERCE &amp; OPS
    </text>
  </g>

  <!-- Main Repository Title -->
  <g filter="url(#shadow)">
    <text x="600" y="132" fill="url(#titleGrad)" font-size="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
      Awesome Wholesale Sales &amp; Operations
    </text>
  </g>

  <!-- Subtitle / Value Proposition -->
  <g filter="url(#shadow)">
    <text x="600" y="174" fill="#cbd5e1" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" text-anchor="middle" letter-spacing="0.2">
      Curated Directory of Top SaaS Platforms, Open-Source B2B Engines &amp; Sales Rep Enablement Tools
    </text>
    <text x="600" y="200" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" text-anchor="middle">
      Wholesale Portals • Order Capture • Customer-Specific Pricing • Trade Show POS • ERP Integration
    </text>
  </g>

  <!-- Highlight Stat Badges (Foreground, Crisp, High-Contrast) -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: SaaS Market Leaders -->
    <g transform="translate(-390, 0)" class="floating-pill-1" filter="url(#pillShadow)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <text x="24" y="26" fill="#38bdf8" font-size="15">🏢</text>
      <text x="52" y="25" fill="#f8fafc" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">10+ Top SaaS</text>
      <text x="140" y="25" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Platforms</text>
    </g>

    <!-- Pill 2: Open Source Tools -->
    <g transform="translate(-195, 0)" class="floating-pill-2" filter="url(#pillShadow)">
      <rect x="0" y="0" width="185" height="42" rx="21" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
      <text x="22" y="26" fill="#a855f7" font-size="15">⭐</text>
      <text x="50" y="25" fill="#f8fafc" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">24+ Open Source</text>
      <text x="146" y="25" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Repos</text>
    </g>

    <!-- Pill 3: B2B Order Flow -->
    <g transform="translate(10, 0)" class="floating-pill-1" filter="url(#pillShadow)">
      <rect x="0" y="0" width="185" height="42" rx="21" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <text x="22" y="26" fill="#10b981" font-size="15">🔄</text>
      <text x="50" y="25" fill="#f8fafc" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">B2B Order Flow</text>
      <text x="146" y="25" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">&amp; EDI</text>
    </g>

    <!-- Pill 4: ERP & Warehouse Sync -->
    <g transform="translate(210, 0)" class="floating-pill-2" filter="url(#pillShadow)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
      <text x="22" y="26" fill="#f59e0b" font-size="15">📦</text>
      <text x="48" y="25" fill="#f8fafc" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">ERP &amp; WMS Sync</text>
      <text x="142" y="25" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Automated</text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(600, 335)">
    <text x="0" y="0" fill="#64748b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" text-anchor="middle" letter-spacing="0.5">
      📊 Transparent Pricing • 💎 Free Tier Limits • 🚀 Stargazer Tracked • 🤝 Community Curated
    </text>
  </g>
</svg>
